# Runs the app behind Caddy, which gets a free HTTPS certificate (Twilio needs wss://).
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
